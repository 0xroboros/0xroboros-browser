name: fork release

# This fork's own release pipeline. Upstream's `release.yml` publishes to
# upstream-owned AWS S3/CloudFront and triggers two more upstream-owned
# repos (lightpanda-io/browser-docker, lightpanda-io/homebrew-browser) via a
# GitHub App this fork has no credentials for — none of that is reachable
# here. This workflow uses only the workflow-scoped GITHUB_TOKEN: platform
# binaries + checksums attached to a GitHub Release on this repo, and a
# multi-arch OCI image pushed to this repo's own GHCR namespace. See
# MODIFICATIONS.md "Lane G — distribution".

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist, e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: linux
            runner: ubuntu-22.04
          - arch: aarch64
            os: linux
            runner: ubuntu-22.04-arm
          - arch: aarch64
            os: macos
            runner: macos-14

    env:
      ARCH: ${{ matrix.arch }}
      OS: ${{ matrix.os }}
      # `inputs` is only resolvable inside a job (or its steps), not in a
      # top-level workflow `env:` block — computed per-job here rather than
      # once at the top, which would have silently gone empty on a
      # workflow_dispatch run.
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: ./.github/actions/install
        with:
          os: ${{ env.OS }}
          arch: ${{ env.ARCH }}

      - name: v8 snapshot
        run: zig build -Dprebuilt_v8_path=v8/libc_v8.a -Doptimize=ReleaseFast snapshot_creator -- src/snapshot.bin

      - name: zig build
        run: zig build -Dsnapshot_path=../../snapshot.bin -Dprebuilt_v8_path=v8/libc_v8.a -Doptimize=ReleaseFast -Dversion=${{ env.RELEASE_TAG }}

      - name: Rename + checksum
        run: |
          mv zig-out/bin/0xroboros-browser 0xroboros-browser-${{ env.ARCH }}-${{ env.OS }}
          shasum -a 256 0xroboros-browser-${{ env.ARCH }}-${{ env.OS }} > 0xroboros-browser-${{ env.ARCH }}-${{ env.OS }}.sha256

      - name: Attach to release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          artifacts: "0xroboros-browser-${{ env.ARCH }}-${{ env.OS }},0xroboros-browser-${{ env.ARCH }}-${{ env.OS }}.sha256"
          tag: ${{ env.RELEASE_TAG }}
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true

  build-image:
    # QEMU-emulated arm64 compilation of zig+V8+hnsd on one runner is what
    # killed both prior attempts (45m timeout, then a raised 150m timeout —
    # see fixed PR #9 and MODIFICATIONS.md "Lane G — distribution"). Root
    # cause is emulation, not headroom: each arch now builds natively on its
    # own GitHub-hosted runner (ubuntu-24.04-arm is free for public repos)
    # and pushes by digest only; `publish-image` below assembles the
    # multi-arch manifest from the two digests. No QEMU anywhere in this
    # path.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-image:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=latest

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
