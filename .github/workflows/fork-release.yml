name: fork release

# This fork's own release pipeline. Upstream's `release.yml` publishes to
# upstream-owned AWS S3/CloudFront and triggers two more upstream-owned
# repos (lightpanda-io/browser-docker, lightpanda-io/homebrew-browser) via a
# GitHub App this fork has no credentials for — none of that is reachable
# here. This workflow uses only the workflow-scoped GITHUB_TOKEN: platform
# binaries + checksums attached to a GitHub Release on this repo, and a
# multi-arch OCI image pushed to this repo's own GHCR namespace. See
# MODIFICATIONS.md "Lane G — distribution".

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist, e.g. v0.1.0)"
        required: true

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: write
  packages: write

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: linux
            runner: ubuntu-22.04
          - arch: aarch64
            os: linux
            runner: ubuntu-22.04-arm
          - arch: aarch64
            os: macos
            runner: macos-14

    env:
      ARCH: ${{ matrix.arch }}
      OS: ${{ matrix.os }}

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: ./.github/actions/install
        with:
          os: ${{ env.OS }}
          arch: ${{ env.ARCH }}

      - name: v8 snapshot
        run: zig build -Dprebuilt_v8_path=v8/libc_v8.a -Doptimize=ReleaseFast snapshot_creator -- src/snapshot.bin

      - name: zig build
        run: zig build -Dsnapshot_path=../../snapshot.bin -Dprebuilt_v8_path=v8/libc_v8.a -Doptimize=ReleaseFast -Dversion=${{ env.RELEASE_TAG }}

      - name: Rename + checksum
        run: |
          mv zig-out/bin/lightpanda lightpanda-${{ env.ARCH }}-${{ env.OS }}
          shasum -a 256 lightpanda-${{ env.ARCH }}-${{ env.OS }} > lightpanda-${{ env.ARCH }}-${{ env.OS }}.sha256

      - name: Attach to release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          artifacts: "lightpanda-${{ env.ARCH }}-${{ env.OS }},lightpanda-${{ env.ARCH }}-${{ env.OS }}.sha256"
          tag: ${{ env.RELEASE_TAG }}
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true

  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      # Pinned by tag, not SHA, for these four: unlike actions/checkout,
      # ncipollo/release-action, and docker/login-action above (copied
      # verbatim from upstream's own already-pinned release.yml), this
      # workflow is new and no verified SHA for these was available to pin
      # against without risking a fabricated hash — this repo does not
      # require SHA pinning (`sha_pinning_required: false`). Tag-pin is the
      # honest choice here; a future pass can move these to verified SHAs.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
